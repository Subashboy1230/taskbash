# Alloy Docker Compose for taskbash (Next.js 15 App Router).
#
# Single service: the Next.js dev server. The app's product routes require a
# live Supabase project + many third-party API keys that are not available in
# the sandbox, so validation targets the public, backend-free marketing page
# at /home. The dev server still boots fully and serves that route.
#
# Networking: network_mode: host is required by the sandbox. Next.js dev binds
# 0.0.0.0:3000 by default, so with host networking the app is reachable on the
# host at port 3000, which Alloy proxies to http://localhost:8080.
#
# Env: .env.local is generated by .alloy/populate-env.sh (run before `up`).
# Next.js automatically loads .env.local from the working directory, so no
# env_file entry is needed; we only pass through IS_ALLOY explicitly.

services:
  web:
    image: node:22-bookworm
    working_dir: /workspace
    network_mode: host
    environment:
      IS_ALLOY: ${IS_ALLOY:-true}
      # Bind the Next dev server explicitly to a stable non-8080 port.
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/workspace
    command: bash -lc "npm install --legacy-peer-deps && npm run dev -- --port 3000 --hostname 0.0.0.0"
